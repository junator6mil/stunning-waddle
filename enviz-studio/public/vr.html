<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── IndexedDB ─────────────────────────────────────────────────────────
const IDB_DB='enviz_models',IDB_STORE='models';
function _openIDB(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_DB,1);r.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);r.onsuccess=e=>res(e.target.result);r.onerror=rej;});}
async function _loadIDB(id){const db=await _openIDB();return new Promise((res,rej)=>{const req=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(id);req.onsuccess=e=>res(e.target.result||null);req.onerror=rej;});}

const params=new URLSearchParams(window.location.search);
const spaceId=params.get('id');

// ── Scene globals ──────────────────────────────────────────────────────
let renderer,vrSession=null,isEntering=false;
let vrScene=null,vrDolly=null,vrCamera=null;
let floorY=0; // model floor Y (set after parse)

// ─────────────────────────────────────────────────────────────────────
//  LOCOMOTION STATE
// ─────────────────────────────────────────────────────────────────────
const WALK_SPEED  = 3.5;   // m/s
const FLY_SPEED   = 5.0;
const PHASE_SPEED = 7.0;
const GRAVITY     = -9.8;
const JUMP_VEL    = 5.5;
const HEIGHT_STEP = 2.5;   // m/s for X/Y buttons
const TURN_SPEED  = 1.3;   // rad/s smooth turn

let mode     = 'WALK';  // 'WALK' | 'FLY' | 'PHASE'
let prevMode = 'WALK';  // remembered before entering PHASE
let velY     = 0;
let onGround = true;

// Button edge detection
const _prev={A:false,X:false,Y:false,R2:false};
let _lastAMs=0;

// Reusable vectors
const _fwd  =new THREE.Vector3();
const _right=new THREE.Vector3();
const _UP   =new THREE.Vector3(0,1,0);

// ── UI helpers ─────────────────────────────────────────────────────────
function setStatus(msg,loading=true){
  document.getElementById('status-text').textContent=msg;
  document.querySelector('#status-row .spin').style.display=loading?'':'none';
}
function setBtn(label,icon,cls,handler){
  const btn=document.getElementById('enter-vr-btn');
  btn.disabled=!handler;btn.className=cls;
  btn.innerHTML=`<span class="material-symbols-outlined text-2xl">${icon}</span>${label}`;
  btn.onclick=handler;
}
function populateUI(){
  if(!spaceId){setStatus('No space ID.',false);return null;}
  const sp=(JSON.parse(localStorage.getItem('enviz_spaces')||'[]')).find(s=>s.id===spaceId);
  if(!sp){setStatus('Space not found.',false);return null;}
  document.getElementById('space-title').textContent=sp.name||'Untitled Space';
  document.getElementById('space-desc').textContent=sp.description||'';
  document.getElementById('nav-space-name').textContent=sp.name||'';
  document.getElementById('nav-space-name').classList.remove('hidden');
  document.getElementById('vr-space-label').textContent=sp.name||'EnvizStudio VR';
  document.getElementById('walk-btn').onclick=()=>location.href=`uplsp.html?id=${spaceId}`;
  if(sp.photo){const img=document.getElementById('cover-img');img.src=sp.photo;img.classList.remove('hidden');document.getElementById('cover-placeholder').classList.add('hidden');}
  return sp;
}

// ── Mode HUD (shown as DOM overlay in headset) ─────────────────────────
function setMode(m){
  mode=m;
  const badge=document.getElementById('mode-badge');
  badge.className='mode-badge';
  if(m==='WALK'){badge.textContent='WALK';badge.className='mode-badge mode-walk';}
  else if(m==='FLY'){badge.textContent='FLY MODE';badge.className='mode-badge mode-fly';}
  else{badge.textContent='PHASE';badge.className='mode-badge mode-phase';}
  // Update controller line colors
  if(renderer){
    const colors={WALK:0xb7d24e,FLY:0xd8b9ff,PHASE:0xff8800};
    for(let i=0;i<2;i++){
      const ctrl=renderer.xr.getController(i);
      if(ctrl.userData.line) ctrl.userData.line.material.color.setHex(colors[m]);
    }
  }
}

// ─────────────────────────────────────────────────────────────────────
//  LOCOMOTION — called every frame from render loop
// ─────────────────────────────────────────────────────────────────────
function handleLocomotion(dt){
  if(!vrSession||!vrDolly||!vrCamera) return;

  let leftSrc=null,rightSrc=null;
  for(const src of vrSession.inputSources){
    if(src.handedness==='left')  leftSrc=src;
    if(src.handedness==='right') rightSrc=src;
  }
  const lgp=leftSrc?.gamepad;
  const rgp=rightSrc?.gamepad;

  // ── R2 (Right Trigger = buttons[0]) → Phase mode ──────────────────
  const r2=rgp?.buttons[0]?.pressed||false;
  if(r2&&!_prev.R2&&mode!=='PHASE'){
    prevMode=mode; setMode('PHASE'); velY=0;
  }else if(!r2&&_prev.R2&&mode==='PHASE'){
    setMode(prevMode);
    if(prevMode==='WALK'){
      if(vrDolly.position.y<floorY) vrDolly.position.y=floorY;
      velY=0;
    }
  }
  _prev.R2=r2;

  // ── A button (Right buttons[4]) → Jump / Double-press Fly ─────────
  const a=rgp?.buttons[4]?.pressed||false;
  if(a&&!_prev.A&&mode!=='PHASE'){
    const now=performance.now();
    if(now-_lastAMs<350){
      // Double press: toggle fly
      setMode(mode==='FLY'?'WALK':'FLY');
      velY=0;
    }else if(mode==='WALK'&&onGround){
      // Single press: jump
      velY=JUMP_VEL; onGround=false;
    }
    _lastAMs=now;
  }
  _prev.A=a;

  // ── Left Stick (axes[0]=strafe, axes[1]=fwd/back) → Move ──────────
  if(lgp){
    const lx=lgp.axes[0]||0;
    const lz=lgp.axes[1]||0;
    if(Math.abs(lx)>0.12||Math.abs(lz)>0.12){
      const spd=mode==='PHASE'?PHASE_SPEED:mode==='FLY'?FLY_SPEED:WALK_SPEED;
      // Move relative to where HEAD is looking (horizontal projection)
      vrCamera.getWorldDirection(_fwd);
      _fwd.y=0; _fwd.normalize();
      _right.crossVectors(_UP,_fwd).negate();
      vrDolly.position.addScaledVector(_fwd,-lz*spd*dt);
      vrDolly.position.addScaledVector(_right, lx*spd*dt);
    }
  }

  // ── Right Stick → Smooth yaw turn (axes[0]) + Vertical in fly (axes[1]) ──
  if(rgp){
    const rx=rgp.axes[0]||0;
    if(Math.abs(rx)>0.15) vrDolly.rotation.y-=rx*TURN_SPEED*dt;

    // Right stick Y controls vertical in FLY and PHASE
    if(mode==='FLY'||mode==='PHASE'){
      const ry=rgp.axes[1]||0;
      if(Math.abs(ry)>0.15) vrDolly.position.y-=ry*FLY_SPEED*dt;
    }
  }

  // ── X button (Left buttons[4]) → Lower height ─────────────────────
  // ── Y button (Left buttons[5]) → Raise height ─────────────────────
  if(lgp){
    if(lgp.buttons[4]?.pressed) vrDolly.position.y-=HEIGHT_STEP*dt;
    if(lgp.buttons[5]?.pressed) vrDolly.position.y+=HEIGHT_STEP*dt;
  }

  // ── Physics: Gravity + Floor collision ────────────────────────────
  if(mode==='WALK'){
    // Gravity
    velY+=GRAVITY*dt;
    vrDolly.position.y+=velY*dt;
    // Floor collision — no phase through in WALK
    if(vrDolly.position.y<=floorY){
      vrDolly.position.y=floorY;
      if(velY<0){velY=0; onGround=true;}
    }else{
      onGround=false;
    }
  }else if(mode==='FLY'){
    // No gravity, no floor collision
    onGround=false;
  }else{
    // PHASE: no collision at all (can go through everything)
    onGround=false;
  }
}

// ─────────────────────────────────────────────────────────────────────
//  WORKER PARSE (non-blocking)
// ─────────────────────────────────────────────────────────────────────
function parseInWorker(buffer){
  return new Promise((resolve,reject)=>{
    const workerSrc=`
if(typeof self.Image==='undefined'){self.Image=class{constructor(){this._s='';this.onload=null;this.onerror=null;this.width=1;this.height=1;this.naturalWidth=1;this.naturalHeight=1;this.complete=true;}get src(){return this._s;}set src(v){this._s=v;if(this.onload)setTimeout(()=>this.onload({target:this}),0);}decode(){return Promise.resolve();}}}
if(typeof self.document==='undefined'){self.document={createElement:(t)=>({style:{},width:0,height:0,getContext:()=>null}),createElementNS:(n,t)=>({style:{}}),body:{appendChild:()=>{},removeChild:()=>{}}};}
importScripts('https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.min.js');
fetch('https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/loaders/GLTFLoader.js').then(r=>r.text()).then(code=>{
  code=code.replace(/^import\\s+.*?from\\s+['""][^'""]+['""]\\s*;?/gm,'').replace(/export\\s+\\{[^}]*\\}\\s*;?/g,'').replace(/export\\s+default\\s+/g,'').replace(/export\\s+class\\s+(\\w+)/g,'class $1').replace(/export\\s+function\\s+(\\w+)/g,'function $1');
  eval(code);self.loader=new GLTFLoader();self.postMessage({ready:true});
}).catch(e=>self.postMessage({ready:false,error:e.message}));
self.onmessage=function(e){
  if(!e.data.buffer)return;
  if(!self.loader){self.postMessage({ok:false,error:'loader not ready'});return;}
  try{self.loader.parse(e.data.buffer,'',function(gltf){try{self.postMessage({ok:true,json:gltf.scene.toJSON()});}catch(err){self.postMessage({ok:false,error:'serialize:'+err.message});}},function(err){self.postMessage({ok:false,error:'parse:'+String(err)});});}catch(err){self.postMessage({ok:false,error:err.message});}
};`;
    let worker;
    try{const blob=new Blob([workerSrc],{type:'application/javascript'});worker=new Worker(URL.createObjectURL(blob));}
    catch(e){reject(new Error('Worker unavailable'));return;}
    worker.onmessage=(e)=>{
      if(e.data.ready===false){worker.terminate();reject(new Error(e.data.error));return;}
      if(e.data.ready===true){worker.postMessage({buffer:buffer.slice(0)});return;}
      worker.terminate();
      if(e.data.ok){try{resolve({scene:new THREE.ObjectLoader().parse(e.data.json)});}catch(err){reject(err);}}
      else{reject(new Error(e.data.error));}
    };
    worker.onerror=(e)=>{worker.terminate();reject(new Error(e.message||'Worker error'));};
  });
}
function parseOnMainThread(buffer){
  return new Promise((res,rej)=>{new GLTFLoader().parse(buffer.slice(0),'',gltf=>res({scene:gltf.scene}),rej);});
}

// ─────────────────────────────────────────────────────────────────────
//  BUILD SCENE (before XR session — pre-warms GPU)
// ─────────────────────────────────────────────────────────────────────
async function buildVREnvironment(parsedScene){
  const wrap=document.getElementById('vr-wrap');
  wrap.style.display='block';
  wrap.style.visibility='hidden';
  document.getElementById('pre-ui').style.zIndex='60';

  const canvas=document.getElementById('vr-canvas');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
  renderer.setPixelRatio(1);
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.shadowMap.enabled=false;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.0;
  renderer.xr.enabled=true;

  vrScene=new THREE.Scene();
  vrScene.background=new THREE.Color(0xd4cfc8);
  vrScene.fog=new THREE.FogExp2(0xd4cfc8,0.012);

  // Lighting (no shadows for performance)
  vrScene.add(new THREE.AmbientLight(0xffffff,1.4));
  const sun=new THREE.DirectionalLight(0xfff5e0,1.2);
  sun.position.set(5,10,5);
  vrScene.add(sun);
  const fill=new THREE.DirectionalLight(0xd8e8ff,0.5);
  fill.position.set(-5,8,-5);
  vrScene.add(fill);

  // Model
  vrScene.add(parsedScene);

  // Bounding box for spawn
  const box=new THREE.Box3().setFromObject(parsedScene);
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  floorY=box.min.y;

  // Player dolly — spawn matches desktop walker
  vrDolly=new THREE.Group();
  vrCamera=new THREE.PerspectiveCamera(80,window.innerWidth/window.innerHeight,0.05,200);
  vrCamera.position.set(0,1.65,0);
  vrDolly.add(vrCamera);
  vrScene.add(vrDolly);
  const spawnEyeY=box.min.y+Math.max(size.y*0.25,1.7);
  vrDolly.position.set(center.x, spawnEyeY-1.65, center.z);

  // Pre-warm GPU
  renderer.render(vrScene,vrCamera);
  await new Promise(r=>requestAnimationFrame(r));

  window.addEventListener('resize',()=>{
    renderer.setSize(window.innerWidth,window.innerHeight);
    vrCamera.aspect=window.innerWidth/window.innerHeight;
    vrCamera.updateProjectionMatrix();
  });
}

// ── Controller visuals ─────────────────────────────────────────────────
function setupControllers(){
  for(let i=0;i<2;i++){
    const ctrl=renderer.xr.getController(i);
    // Small pointer dot + ray line
    const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-0.15)]);
    const lineMat=new THREE.LineBasicMaterial({color:0xb7d24e,transparent:true,opacity:0.8});
    const line=new THREE.Line(lineGeo,lineMat);
    ctrl.add(line);
    ctrl.userData.line=line;
    ctrl.addEventListener('connected',(e)=>{ctrl.userData.handedness=e.data.handedness;});
    vrScene.add(ctrl);
  }
}

// ── Render loop ────────────────────────────────────────────────────────
function tick(){
  const dt=Math.min(clock.getDelta(),0.1);
  handleLocomotion(dt);
  renderer.render(vrScene,vrCamera);
}
const clock=new THREE.Clock();

// ── Enter VR ──────────────────────────────────────────────────────────
async function enterVR(){
  if(isEntering)return;
  isEntering=true;
  const btn=document.getElementById('enter-vr-btn');
  btn.disabled=true;
  btn.innerHTML='<span class="material-symbols-outlined text-2xl spin">autorenew</span>Starting...';
  if(vrSession){try{await vrSession.end();}catch(_){}vrSession=null;await new Promise(r=>setTimeout(r,300));}

  let session;
  try{
    session=await navigator.xr.requestSession('immersive-vr',{
      optionalFeatures:['local-floor','bounded-floor','hand-tracking','dom-overlay'],
      domOverlay:{root:document.getElementById('vr-hud')}
    });
  }catch(e){
    // Retry without dom-overlay if it caused the failure
    try{
      session=await navigator.xr.requestSession('immersive-vr',{
        optionalFeatures:['local-floor','bounded-floor','hand-tracking']
      });
    }catch(e2){
      setStatus('Could not start VR: '+e2.message,false);
      const wrap=document.getElementById('vr-wrap');
      wrap.style.display='none';wrap.style.visibility='';
      document.getElementById('pre-ui').style.zIndex='';
      isEntering=false;
      setBtn('Enter VR','cardboard',"w-full py-4 rounded-2xl font-bold text-lg font-['Plus_Jakarta_Sans'] flex items-center justify-center gap-3 bg-[#b7d24e] text-[#2a3400] cursor-pointer hover:brightness-110 active:scale-95 shadow-lg transition-all",enterVR);
      return;
    }
  }

  vrSession=session;
  // Show HUD overlay
  document.getElementById('vr-hud').style.display='block';
  // Reset locomotion state
  setMode('WALK'); velY=0; onGround=true;
  _prev.A=false;_prev.R2=false;_prev.X=false;_prev.Y=false;

  const wrap=document.getElementById('vr-wrap');
  wrap.style.visibility='';
  document.getElementById('pre-ui').classList.add('hidden');

  setupControllers();
  await renderer.xr.setSession(session);
  session.addEventListener('end',()=>{vrSession=null;isEntering=false;exitVR();});
  clock.start();
  renderer.setAnimationLoop(tick);
}

window.exitVR=function(){
  renderer?.setAnimationLoop(null);
  if(vrSession){try{vrSession.end();}catch(_){}vrSession=null;}
  isEntering=false;
  document.getElementById('vr-hud').style.display='none';
  const wrap=document.getElementById('vr-wrap');
  wrap.style.display='none';wrap.style.visibility='';
  document.getElementById('pre-ui').classList.remove('hidden');
  document.getElementById('pre-ui').style.zIndex='';
};

// ── VR detection ──────────────────────────────────────────────────────
async function checkVRSupport(){
  const badge=document.getElementById('vr-support-badge');
  badge.classList.remove('hidden');
  if(!navigator.xr){
    badge.textContent='WebXR not supported - use Chrome or Edge';
    badge.className='mb-6 text-xs font-bold px-3 py-1.5 rounded-lg w-fit bg-red-900/30 border border-red-500/30 text-red-300';
    return false;
  }
  const ok=await navigator.xr.isSessionSupported('immersive-vr').catch(()=>false);
  if(ok){
    badge.textContent='VR headset detected - ready to enter';
    badge.className='mb-6 text-xs font-bold px-3 py-1.5 rounded-lg w-fit bg-[#b7d24e]/10 border border-[#b7d24e]/30 text-[#b7d24e]';
    document.getElementById('vr-hint').classList.remove('hidden');
  }else{
    badge.textContent='No VR headset - use Walk on Desktop below';
    badge.className='mb-6 text-xs font-bold px-3 py-1.5 rounded-lg w-fit bg-white/5 border border-white/10 text-on-surface-variant';
  }
  return ok;
}

// ── Boot ──────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',async()=>{
  try{
    const sp=populateUI();if(!sp)return;
    setStatus('Loading from storage...',true);
    const ab=await _loadIDB(spaceId).catch(()=>null);
    if(!ab){
      setStatus('Model not cached - open Walk on Desktop first.',false);
      document.getElementById('walk-btn').classList.add('ring-2','ring-primary/40');
      setBtn('Not Cached','warning',"w-full py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-3 bg-white/5 text-on-surface-variant border border-white/10 cursor-not-allowed",null);
      return;
    }
    let parsed;
    try{
      setStatus('Parsing model in background...',true);
      parsed=await parseInWorker(ab);
    }catch(e){
      console.warn('Worker failed, using main thread:',e);
      setStatus('Parsing model (please wait)...',true);
      await new Promise(r=>setTimeout(r,80));
      try{parsed=await parseOnMainThread(ab);}catch(e2){setStatus('Parse error: '+e2.message,false);return;}
    }
    setStatus('Building scene...',true);
    await buildVREnvironment(parsed.scene);
    setStatus('Ready',false);
    const vrOk=await checkVRSupport();
    if(vrOk){
      setBtn('Enter VR','cardboard',"w-full py-4 rounded-2xl font-bold text-lg font-['Plus_Jakarta_Sans'] flex items-center justify-center gap-3 bg-[#b7d24e] text-[#2a3400] cursor-pointer hover:brightness-110 active:scale-95 shadow-lg shadow-[#b7d24e]/20 transition-all",enterVR);
      document.getElementById('vr-ring1').classList.remove('hidden');
      document.getElementById('vr-ring2').classList.remove('hidden');
    }else{
      setBtn('Walk in 3D (Desktop)','view_in_ar',"w-full py-4 rounded-2xl font-bold text-lg font-['Plus_Jakarta_Sans'] flex items-center justify-center gap-3 bg-primary/15 text-primary cursor-pointer hover:bg-primary/25 active:scale-95 border border-primary/20 transition-all",()=>location.href=`uplsp.html?id=${spaceId}`);
    }
  }catch(e){setStatus('Error: '+e.message,false);console.error(e);}
});
</script>
