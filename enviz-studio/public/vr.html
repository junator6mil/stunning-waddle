<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// â”€â”€ IndexedDB (same DB as uplsp.html) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const IDB_DB='enviz_models', IDB_STORE='models';
function _openIDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_DB,1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);
    r.onsuccess=e=>res(e.target.result); r.onerror=rej;
  });
}
async function _loadIDB(id){
  const db=await _openIDB();
  return new Promise((res,rej)=>{
    const req=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(id);
    req.onsuccess=e=>res(e.target.result||null); req.onerror=rej;
  });
}

// â”€â”€ State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let scene, camera, renderer, vrSession=null;
let playerDolly, modelBuffer=null;
const clock=new THREE.Clock();
const MOVE_SPEED=3.2, RUN_SPEED=6.5;

// â”€â”€ URL params â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const params=new URLSearchParams(window.location.search);
const spaceId=params.get('id');

// â”€â”€ UI helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function setStatus(msg, loading=true){
  document.getElementById('status-text').textContent=msg;
  document.querySelector('#status-row .spin').style.display=loading?'':'none';
}
function setBtn(label, icon, cls, handler){
  const btn=document.getElementById('enter-vr-btn');
  btn.disabled=false;
  btn.className=cls;
  btn.innerHTML=`<span class="material-symbols-outlined text-2xl">${icon}</span>${label}`;
  btn.onclick=handler;
}

// â”€â”€ Populate metadata from localStorage â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function populateUI(){
  if(!spaceId){ setStatus('No space ID in URL.',false); return null; }
  const sp=(JSON.parse(localStorage.getItem('enviz_spaces')||'[]')).find(s=>s.id===spaceId);
  if(!sp){ setStatus('Space not found.',false); return null; }
  document.getElementById('space-title').textContent=sp.name||'Untitled Space';
  document.getElementById('space-desc').textContent=sp.description||'';
  document.getElementById('nav-space-name').textContent=sp.name||'';
  document.getElementById('nav-space-name').classList.remove('hidden');
  document.getElementById('vr-space-label').textContent=sp.name||'EnvizStudio VR';
  document.getElementById('walk-btn').onclick=()=>location.href=`uplsp.html?id=${spaceId}`;
  if(sp.photo){
    const img=document.getElementById('cover-img');
    img.src=sp.photo; img.classList.remove('hidden');
    document.getElementById('cover-placeholder').classList.add('hidden');
  }
  return sp;
}

// â”€â”€ Init Three.js (called just before entering VR, canvas is visible) â”€
function initThree(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x100f31);
  scene.fog=new THREE.Fog(0xf0eaff,30,100);

  playerDolly=new THREE.Group();
  camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.05,300);
  camera.position.set(0,1.6,0);
  playerDolly.add(camera);
  scene.add(playerDolly);

  const canvas=document.getElementById('vr-canvas');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(canvas.clientWidth||window.innerWidth, canvas.clientHeight||window.innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.2;
  renderer.xr.enabled=true;

  // Lighting
  scene.add(new THREE.AmbientLight(0xd8b9ff,0.7));
  const sun=new THREE.DirectionalLight(0xffffff,1.5);
  sun.position.set(10,20,10); sun.castShadow=true; scene.add(sun);
  scene.add(Object.assign(new THREE.DirectionalLight(0xb7d24e,0.3),{position:new THREE.Vector3(-10,5,-10)}));

  window.addEventListener('resize',()=>{
    renderer.setSize(window.innerWidth,window.innerHeight);
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
  });
}

// â”€â”€ Setup XR controllers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function setupControllers(){
  for(let i=0;i<2;i++){
    const ctrl=renderer.xr.getController(i);
    const pts=[new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-2)];
    ctrl.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0xd8b9ff,transparent:true,opacity:0.5})
    ));
    scene.add(ctrl);
  }
}

// â”€â”€ Parse and place model â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function parseModel(arrayBuffer){
  return new Promise((res,rej)=>{
    new GLTFLoader().parse(arrayBuffer,'',gltf=>{
      scene.add(gltf.scene);
      const box=new THREE.Box3().setFromObject(gltf.scene);
      const center=box.getCenter(new THREE.Vector3());
      playerDolly.position.set(center.x, box.min.y+1.7, center.z);
      res();
    },rej);
  });
}

// â”€â”€ Locomotion (thumbstick) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const _fwd=new THREE.Vector3();
const _right=new THREE.Vector3();
const _turnState={left:false, right:false};
function handleLocomotion(dt){
  if(!vrSession) return;
  for(const src of vrSession.inputSources){
    if(!src.gamepad) continue;
    const ax=src.gamepad.axes;
    const lx=ax.length>3?ax[2]:ax[0]||0;
    const lz=ax.length>3?ax[3]:ax[1]||0;
    const running=src.gamepad.buttons[1]?.pressed||false; // grip = run
    const spd=running?RUN_SPEED:MOVE_SPEED;

    if(src.handedness==='left'&&(Math.abs(lx)>0.12||Math.abs(lz)>0.12)){
      camera.getWorldDirection(_fwd); _fwd.y=0; _fwd.normalize();
      _right.crossVectors(new THREE.Vector3(0,1,0),_fwd).negate();
      playerDolly.position.addScaledVector(_fwd,-lz*spd*dt);
      playerDolly.position.addScaledVector(_right, lx*spd*dt);
    }
    if(src.handedness==='right'){
      const rx=ax.length>3?ax[2]:ax[0]||0;
      const active=Math.abs(rx)>0.65;
      if(active&&!_turnState.right){
        playerDolly.rotation.y-=Math.sign(rx)*(Math.PI/6);
      }
      _turnState.right=active; // debounce: only fire once per flick
    }
  }
}

// â”€â”€ Render loop â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function tick(){
  handleLocomotion(Math.min(clock.getDelta(),0.1));
  renderer.render(scene,camera);
}

// â”€â”€ Enter VR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function enterVR(){
  // FIX: local-floor is optional â€” works with or without floor tracking
  let session;
  try{
    session=await navigator.xr.requestSession('immersive-vr',{
      optionalFeatures:['local-floor','bounded-floor','hand-tracking']
    });
  } catch(e){
    setStatus('VR session failed: '+e.message, false);
    return;
  }

  vrSession=session;

  // Show canvas, hide UI
  document.getElementById('pre-ui').classList.add('hidden');
  const wrap=document.getElementById('vr-wrap');
  wrap.classList.remove('hidden');

  // FIX: init Three.js NOW when canvas is visible & sized
  initThree();
  setupControllers();

  // Parse model into visible scene
  setStatus('Loadingâ€¦', true);
  try{ await parseModel(modelBuffer); }
  catch(e){ console.error('Model parse error:',e); }

  await renderer.xr.setSession(session);
  session.addEventListener('end',()=>{ vrSession=null; exitVR(); });
  renderer.setAnimationLoop(tick);
}

window.exitVR=function(){
  renderer?.setAnimationLoop(null);
  if(vrSession){ try{ vrSession.end(); }catch(_){} vrSession=null; }
  document.getElementById('vr-wrap').classList.add('hidden');
  document.getElementById('pre-ui').classList.remove('hidden');
};

// â”€â”€ Check WebXR support â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function checkVRSupport(){
  const badge=document.getElementById('vr-support-badge');
  badge.classList.remove('hidden');
  if(!navigator.xr){
    badge.textContent='âš  WebXR not supported in this browser (try Chrome/Edge)';
    badge.className='mb-6 text-xs font-bold px-3 py-1.5 rounded-lg w-fit bg-red-900/30 border border-red-500/30 text-red-300';
    return false;
  }
  const ok=await navigator.xr.isSessionSupported('immersive-vr').catch(()=>false);
  if(ok){
    badge.textContent='âœ“ VR headset detected â€” ready to enter';
    badge.className='mb-6 text-xs font-bold px-3 py-1.5 rounded-lg w-fit bg-[#b7d24e]/10 border border-[#b7d24e]/30 text-[#b7d24e]';
    document.getElementById('vr-hint').classList.remove('hidden');
  } else {
    badge.textContent='â„¹ No VR headset â€” use "Walk on Desktop" below';
    badge.className='mb-6 text-xs font-bold px-3 py-1.5 rounded-lg w-fit bg-white/5 border border-white/10 text-on-surface-variant';
  }
  return ok;
}

// â”€â”€ Boot â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
document.addEventListener('DOMContentLoaded',async()=>{
  try{
    const sp=populateUI();
    if(!sp) return;

    setStatus('Loading model from storageâ€¦', true);
    const ab=await _loadIDB(spaceId).catch(()=>null);

    if(!ab){
      setStatus('Model not cached â€” open "Walk on Desktop" first to cache it.',false);
      document.getElementById('walk-btn').classList.add('ring-2','ring-primary/40');
      setBtn('Model Not Cached','warning','w-full py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-3 bg-white/5 text-on-surface-variant border border-white/10 cursor-not-allowed',null);
      document.getElementById('enter-vr-btn').disabled=true;
      return;
    }

    modelBuffer=ab; // store for later use in enterVR()
    setStatus('Model ready âœ“', false);

    const vrOk=await checkVRSupport();
    if(vrOk){
      setBtn(
        'Enter VR','cardboard',
        "w-full py-4 rounded-2xl font-bold text-lg font-['Plus_Jakarta_Sans'] flex items-center justify-center gap-3 bg-[#b7d24e] text-[#2a3400] cursor-pointer hover:brightness-110 active:scale-95 shadow-lg shadow-[#b7d24e]/20 transition-all",
        enterVR
      );
      document.getElementById('vr-ring1').classList.remove('hidden');
      document.getElementById('vr-ring2').classList.remove('hidden');
    } else {
      setBtn(
        'Walk in 3D (Desktop)','view_in_ar',
        "w-full py-4 rounded-2xl font-bold text-lg font-['Plus_Jakarta_Sans'] flex items-center justify-center gap-3 bg-primary/15 text-primary cursor-pointer hover:bg-primary/25 active:scale-95 border border-primary/20 transition-all",
        ()=>location.href=`uplsp.html?id=${spaceId}`
      );
    }
  } catch(e){
    setStatus('Error: '+e.message, false);
    console.error('VR boot error:',e);
  }
});
</script>
</body>
</html>
